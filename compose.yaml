services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hackathon_max
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon_max"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MAX_TOKEN: ${MAX_TOKEN}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/hackathon_max
    command: >
      sh -c "
      alembic upgrade head &&
      python -m scripts.setup_database &&
      python -m app.main
      "
    restart: unless-stopped

volumes:
  postgres_data: